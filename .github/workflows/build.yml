name: Build Geode Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        continue-on-error: true
        with:
          combine: true
          target: Win64
          bindings-ref: 7f6c2a75742856de88dad354e576dcff8a28e881
          use-cpm-cache: false
          ccache-variant: ''
      - name: Report build errors
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::error::BINDINGS_ENV=$env:GEODE_BINDINGS_REPO_PATH"
          if (Test-Path build/CMakeCache.txt) { Select-String -Path build/CMakeCache.txt -Pattern "BINDINGS" | % { Write-Output "::error::CACHE $($_.Line)" } }
          if (Test-Path build) {
            $out = cmake --build build 2>&1 | Out-String
          } else {
            $out = "No build folder: CMake configure or SDK setup failed."
          }
          $lines = $out -split "`n" | Where-Object { $_ -match "error|main.cpp|In file included|instantiation|FAILED" } | Select-Object -First 40
          if (-not $lines) { $lines = ($out -split "`n" | Select-Object -Last 25) }
          foreach ($l in $lines) { Write-Output "::error::$($l.Trim())" }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: input-precision
          path: ./**/*.geode
