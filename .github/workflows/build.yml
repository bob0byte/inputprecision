name: Build Geode Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: input-precision
          path: ./**/*.geode
