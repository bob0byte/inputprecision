name: Build Geode Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        continue-on-error: true
        with:
          combine: true
          target: Win64
          bindings-ref: f8aec5d1f3df76d840dfd2609f02cef30dc6efdf
          use-cpm-cache: false
          sdk: nightly
          ccache-variant: ''
      - name: Report build errors
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output "::error::BINDINGS_ENV=$env:GEODE_BINDINGS_REPO_PATH"
          if (Test-Path bindings-repo) { Write-Output "::error::BINDINGS_HEAD $(git -C bindings-repo log -1 --format='%h %cs %s')"; Write-Output "::error::MAPPING_DIR $(Test-Path bindings-repo/bindings/include/Geode/mapping) CODEGEN_DIR $(Test-Path bindings-repo/codegen)" }
          Write-Output "::error::SDK_HEAD $(git -C geode-sdk-clone log -1 --format='%h %cs %s')"
          if (Test-Path build/CMakeCache.txt) { Select-String -Path build/CMakeCache.txt -Pattern "BINDINGS_SOURCE|GEODE_SDK|GD_VERSION" | % { Write-Output "::error::CACHE $($_.Line)" } }
          if (-not (Test-Path build/build.ninja)) {
            $cfg = cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DGEODE_DONT_INSTALL_MODS=ON 2>&1 | Out-String
            $cl = $cfg -split "`n"
            for ($i = 0; $i -lt $cl.Length; $i++) {
              if ($cl[$i] -match "CMake Error|error") { $cl[$i..([Math]::Min($i+6, $cl.Length-1))] | % { if ($_.Trim()) { Write-Output "::error::CFG $($_.Trim())" } } }
            }
            exit 1
          }
          if (Test-Path build) {
            $out = cmake --build build 2>&1 | Out-String
          } else {
            $out = "No build folder: CMake configure or SDK setup failed."
          }
          $lines = $out -split "`n" | Where-Object { $_ -match "error:|main.cpp:" } | Select-Object -Unique | Select-Object -First 40
          if (-not $lines) { $lines = ($out -split "`n" | Select-Object -Last 25) }
          foreach ($l in $lines) { Write-Output "::error::$($l.Trim())" }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: input-precision
          path: ./**/*.geode
